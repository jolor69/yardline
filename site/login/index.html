<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title data-i18n="login.meta.title">Log in to Yardline</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
@import url("../tokens.css");

* { box-sizing: border-box; }
html, body { overflow-x: clip; }

body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--color-paper);
  color: var(--color-ink-2);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--lh-normal);
}

a { color: inherit; text-decoration: none; }

h1 {
  font-family: var(--font-display);
  font-weight: var(--display-weight);
  color: var(--color-ink);
  margin: 0 0 var(--space-2xs);
  font-size: var(--text-lg);
}

:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

/* Header */
.mast {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-md) var(--space-lg);
}

.mast__brand {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--color-ink);
}

.lang-toggle {
  display: flex;
  border: 1px solid var(--color-rule-2);
  border-radius: var(--radius-pill);
  padding: 2px;
  gap: 2px;
}

.lang-btn {
  position: relative;
  border: none;
  background: transparent;
  color: var(--color-muted);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: var(--tracking-label);
  line-height: 1;
  padding: var(--space-2xs) var(--space-xs);
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: background-color var(--dur-short) var(--ease-out),
              color var(--dur-short) var(--ease-out);
}

.lang-btn[aria-pressed="true"] { background: var(--color-paper-3); color: var(--color-ink); }

@media (hover: hover) and (pointer: fine) {
  .lang-btn:hover { color: var(--color-ink); }
}

.lang-btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* Main */
main {
  flex: 1;
  display: grid;
  place-items: center;
  padding: var(--space-lg);
}

.login-card {
  width: 100%;
  max-width: 24rem;
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-card);
  padding: var(--space-xl);
  background: var(--color-paper-2);
}

.login-card p.sub { color: var(--color-muted); font-size: var(--text-sm); margin: 0 0 var(--space-lg); }
.login-card.is-hidden { display: none; }

/* Forms */
.field { display: flex; flex-direction: column; gap: var(--space-2xs); margin-bottom: var(--space-md); }
.field label { font-size: var(--text-sm); font-weight: 600; color: var(--color-ink-2); }

.input {
  height: 44px;
  padding-inline: var(--space-sm);
  border-radius: var(--radius-input);
  border: 1px solid var(--color-rule-2);
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  outline: 2px solid transparent;
  outline-offset: 1px;
  transition: background-color var(--dur-short) var(--ease-out);
  width: 100%;
}

.input:hover { background: var(--color-paper-2); }
.input:focus-visible { outline-color: var(--color-focus); border-color: var(--color-ink-2); }
.input:disabled { opacity: 0.55; cursor: not-allowed; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2xs);
  height: 40px;
  padding-inline: var(--space-lg);
  border-radius: var(--radius-pill);
  border: none;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  text-decoration: none;
  transition: background-color var(--dur-short) var(--ease-out), transform 100ms var(--ease-out);
}

.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

.btn--accent { background: var(--color-accent); color: var(--color-accent-ink); }
.btn--accent:hover { background: oklch(59% 0.17 28); }
.btn--full { width: 100%; }

.btn--outline { background: transparent; color: var(--color-ink); border: 1px solid var(--color-rule-2); }
@media (hover: hover) and (pointer: fine) {
  .btn--outline:hover { border-color: var(--color-ink-2); background: var(--color-paper-2); }
}

.telegram-hint { text-align: center; margin: var(--space-2xs) 0 0; }

.login-divider {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  margin: var(--space-lg) 0;
  color: var(--color-muted);
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: var(--tracking-label);
}
.login-divider::before, .login-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--color-rule);
}

.back-link {
  display: block;
  width: 100%;
  margin-top: var(--space-lg);
  padding: var(--space-sm);
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-input);
  background: transparent;
  color: var(--color-accent);
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  font-family: var(--font-body);
  font-size: var(--text-sm);
}

.error-text { color: var(--color-error); font-size: var(--text-sm); min-height: 1lh; }

/* Links */
.form-footer {
  margin-top: var(--space-lg);
  text-align: center;
  font-size: var(--text-sm);
}

.form-footer a {
  color: var(--color-accent);
  font-weight: 600;
  text-decoration: underline;
}

.form-footer a:hover {
  color: oklch(59% 0.17 28);
}

.forgot-password {
  display: block;
  color: var(--color-accent);
  font-weight: 600;
  text-decoration: underline;
  font-size: var(--text-sm);
  text-align: right;
  margin-top: -var(--space-sm);
  margin-bottom: var(--space-md);
}

.forgot-password:hover {
  color: oklch(59% 0.17 28);
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 1ms !important; }
}
</style>
</head>
<body>

<header class="mast">
  <a class="mast__brand" href="/">Yardline</a>
  <div class="lang-toggle" role="group" aria-label="Language">
    <button type="button" class="lang-btn" data-lang-btn="en" aria-pressed="true">EN</button>
    <button type="button" class="lang-btn" data-lang-btn="id" aria-pressed="false">ID</button>
  </div>
</header>

<main>
  <div class="login-card" id="state-login">
    <h1 data-i18n="login.title">Log in</h1>
    <p class="sub" data-i18n="login.subtitle">Sign in to your Yardline account</p>

    <form id="login-form">
      <div class="field">
        <label for="email" data-i18n="login.email">Email</label>
        <input class="input" id="email" type="email" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password" data-i18n="login.password">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password" required />
        <a class="forgot-password" href="/reset-password" data-i18n="login.forgot">Forgot password?</a>
      </div>

      <p class="error-text" id="login-error"></p>
      <button class="btn btn--accent btn--full" type="submit" id="login-submit" data-i18n="login.submit">Log in</button>
    </form>

    <div class="login-divider" role="separator"><span data-i18n="login.or">or</span></div>

    <button class="btn btn--outline btn--full" id="telegram-login-btn" type="button" data-i18n="login.telegram.button">Log in with phone number</button>
    <p class="sub telegram-hint" data-i18n="login.telegram.hint">We'll confirm it's you via Telegram — no password needed.</p>

    <div class="form-footer">
      <p data-i18n="login.noAccount">Don't have an account? <a href="/get-started" data-i18n="login.signup">Sign up</a></p>
    </div>
  </div>

  <!-- Telegram login waiting — deep link + status polling -->
  <div class="login-card is-hidden" id="state-telegram-wait">
    <h1 data-i18n="login.telegram.waitTitle">Almost there</h1>
    <p class="sub" data-i18n="login.telegram.waitSub">Open Telegram and tap Start to log in.</p>

    <a class="btn btn--accent btn--full" id="telegram-deep-link" href="#" target="_blank" rel="noopener" data-i18n="login.telegram.openButton">Open Telegram</a>

    <p class="sub" id="telegram-wait-status" style="margin-top: var(--space-lg);" data-i18n="login.telegram.waiting">Waiting for you to tap Start in Telegram…</p>
    <p class="error-text" id="telegram-wait-error"></p>

    <button class="back-link" id="telegram-wait-back-btn" type="button" data-i18n="login.telegram.back">Back</button>
  </div>
</main>

<script>
(function () {
  "use strict";

  var $ = function (sel) { return document.querySelector(sel); };

  async function api(path, opts) {
    var res = await fetch("/api" + path, Object.assign({ credentials: "include" }, opts, {
      headers: Object.assign({ "Content-Type": "application/json" }, (opts && opts.headers) || {}),
    }));
    var text = await res.text();
    var data = text ? JSON.parse(text) : null;
    if (!res.ok) {
      var err = new Error((data && data.error) || "Request failed");
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // Already logged in? Skip the form entirely — showing a login page to
  // someone with a valid session serves no purpose.
  (async function redirectIfLoggedIn() {
    try {
      var account = await api("/auth/me");
      redirectByRole(account);
    } catch (e) {
      // 401 (not logged in) — proceed and show the form as normal.
    }
  })();

  var form = $("#login-form");
  var submit = $("#login-submit");
  var errorEl = $("#login-error");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorEl.textContent = "";

    var email = $("#email").value;
    var password = $("#password").value;

    submit.disabled = true;
    try {
      var account = await api("/auth/login", {
        method: "POST",
        body: JSON.stringify({ email: email, password: password })
      });

      redirectByRole(account);
    } catch (err) {
      errorEl.textContent = t("login.error") || err.message;
    } finally {
      submit.disabled = false;
    }
  });

  function redirectByRole(account) {
    if (account.role === "admin") {
      window.location.href = "/admin";
    } else if (account.role === "seller") {
      window.location.href = "/seller";
    } else {
      window.location.href = "/buyer";
    }
  }

  /* Telegram login */
  var TELEGRAM_POLL_MS = 1500;
  var TELEGRAM_MAX_WAIT_MS = 5 * 60 * 1000;
  var telegramPollTimer = null;
  var telegramPollDeadline = null;

  function stopTelegramPoll() {
    if (telegramPollTimer) {
      clearInterval(telegramPollTimer);
      telegramPollTimer = null;
    }
  }

  function showState(id) {
    ["state-login", "state-telegram-wait"].forEach(function (s) {
      $(("#" + s)).classList.toggle("is-hidden", s !== id);
    });
  }

  var telegramWaitStatus = $("#telegram-wait-status");
  var telegramWaitError = $("#telegram-wait-error");
  var telegramDeepLink = $("#telegram-deep-link");

  $("#telegram-wait-back-btn").addEventListener("click", function () {
    stopTelegramPoll();
    showState("state-login");
  });

  $("#telegram-login-btn").addEventListener("click", async function () {
    var btn = $("#telegram-login-btn");
    btn.disabled = true;
    try {
      var res = await api("/telegram/start", {
        method: "POST",
        body: JSON.stringify({ intent: "login" })
      });

      telegramDeepLink.href = res.deep_link;
      telegramWaitError.textContent = "";
      telegramWaitStatus.textContent = t("login.telegram.waiting");
      showState("state-telegram-wait");
      startTelegramPoll(res.token);
    } catch (err) {
      errorEl.textContent = err.message || t("login.error");
    } finally {
      btn.disabled = false;
    }
  });

  function startTelegramPoll(token) {
    stopTelegramPoll();
    telegramPollDeadline = Date.now() + TELEGRAM_MAX_WAIT_MS;

    telegramPollTimer = setInterval(async function () {
      if (Date.now() > telegramPollDeadline) {
        stopTelegramPoll();
        telegramWaitError.textContent = t("login.telegram.timedOut");
        return;
      }

      var status;
      try {
        status = await api("/telegram/status?token=" + encodeURIComponent(token));
      } catch (err) {
        // Transient network hiccup — keep polling until the deadline.
        return;
      }

      if (status.status === "awaiting_start") {
        telegramWaitStatus.textContent = t("login.telegram.waiting");
      } else if (status.status === "completed" || status.status === "consumed") {
        stopTelegramPoll();
        redirectByRole(status.account);
      } else if (status.status === "expired") {
        stopTelegramPoll();
        telegramWaitError.textContent = t("login.telegram.expired");
      } else if (status.status === "error") {
        stopTelegramPoll();
        var detailKey = "login.telegram.error." + (status.detail || "generic");
        var msg = t(detailKey);
        telegramWaitError.textContent = msg === detailKey ? t("login.telegram.error.generic") : msg;
      } else if (status.status === "not_found") {
        stopTelegramPoll();
        telegramWaitError.textContent = t("login.telegram.expired");
      }
    }, TELEGRAM_POLL_MS);
  }

  /* Language toggle */
  var idText = {
    "login.meta.title": "Masuk ke Yardline",
    "login.title": "Masuk",
    "login.subtitle": "Masuk ke akun Yardline Anda",
    "login.email": "Email",
    "login.password": "Kata Sandi",
    "login.forgot": "Lupa kata sandi?",
    "login.submit": "Masuk",
    "login.noAccount": "Belum punya akun? <a href=\"/get-started\" data-i18n=\"login.signup\">Daftar</a>",
    "login.signup": "Daftar",
    "login.error": "Email atau kata sandi salah",
    "login.or": "atau",
    "login.telegram.button": "Masuk dengan nomor telepon",
    "login.telegram.hint": "Kami akan mengonfirmasi lewat Telegram — tanpa kata sandi.",
    "login.telegram.waitTitle": "Hampir selesai",
    "login.telegram.waitSub": "Buka Telegram dan ketuk Start untuk masuk.",
    "login.telegram.openButton": "Buka Telegram",
    "login.telegram.waiting": "Menunggu Anda mengetuk Start di Telegram…",
    "login.telegram.back": "Kembali",
    "login.telegram.expired": "Tautan ini kedaluwarsa — silakan coba lagi.",
    "login.telegram.timedOut": "Menunggu terlalu lama — silakan coba lagi.",
    "login.telegram.error.generic": "Terjadi kesalahan. Silakan coba lagi.",
    "login.telegram.error.not_registered": "Tidak ditemukan akun untuk Telegram ini. Silakan daftar dulu.",
    "login.telegram.error.account_missing": "Terjadi kesalahan. Silakan coba lagi."
  };

  var i18nEls = document.querySelectorAll("[data-i18n]");
  var enText = {};
  i18nEls.forEach(function (el) {
    var key = el.dataset.i18n;
    enText[key] = el.tagName === "TITLE" ? el.textContent : el.innerHTML;
  });

  // Dynamic-only keys (never tagged on a DOM element, only referenced via
  // t()) — without this, English silently falls back to the raw key string.
  // "login.error" predates this change; same bug, fixed in passing.
  Object.assign(enText, {
    "login.error": "Incorrect email or password",
    "login.telegram.expired": "This link has expired — please try again.",
    "login.telegram.timedOut": "This took too long — please try again.",
    "login.telegram.error.generic": "Something went wrong. Please try again.",
    "login.telegram.error.not_registered": "No account found for this Telegram. Please sign up first.",
    "login.telegram.error.account_missing": "Something went wrong. Please try again."
  });

  var currentDict = enText;

  function t(key) {
    return currentDict[key] || enText[key] || key;
  }

  var langBtns = document.querySelectorAll("[data-lang-btn]");

  function setLang(lang) {
    currentDict = lang === "id" ? Object.assign({}, enText, idText) : enText;
    i18nEls.forEach(function (el) {
      var key = el.dataset.i18n;
      var value = currentDict[key] || enText[key];
      if (el.tagName === "TITLE") {
        el.textContent = value;
      } else {
        el.innerHTML = value;
      }
    });
    document.documentElement.lang = lang;
    langBtns.forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.langBtn === lang));
    });
    try { localStorage.setItem("yardline-lang", lang); } catch (e) {}
  }

  langBtns.forEach(function (btn) {
    btn.addEventListener("click", function () { setLang(btn.dataset.langBtn); });
  });

  function getCookie(name) {
    var m = document.cookie.match(new RegExp("(^|; )" + name + "=([^;]*)"));
    return m ? decodeURIComponent(m[2]) : null;
  }

  var savedLang = null;
  try { savedLang = localStorage.getItem("yardline-lang"); } catch (e) {}
  var geoLang = savedLang === null ? getCookie("yardline-geo") : null;
  if (savedLang === "id" || geoLang === "id") { setLang("id"); }
})();
</script>

</body>
</html>
